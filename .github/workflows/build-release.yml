name: Build OpenWrt Release & kmod Feed

# Cost & quota protection:
# - Public repositories get UNLIMITED free GitHub Actions minutes on ubuntu-24.04.
# - Even on private repos, this workflow NEVER runs on normal git pushes or PRs;
#   it runs ONLY when triggered manually (workflow_dispatch) or on explicit `v*` tags.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2026.11-r1). Leave empty for date-based tag.'
        required: false
        default: ''
      build_all_kmods:
        description: 'Build ALL kmod-* packages for GitHub Pages feed (slower; auto-enabled on v* tags)'
        type: boolean
        default: false
      skip_release:
        description: 'Compile check only (skip creating GitHub Release & Pages deploy)'
        type: boolean
        default: false
      openwrt_ref:
        description: 'Optional upstream OpenWrt commit/tag/branch override (blank = pinned tested commit)'
        required: false
        default: ''
  push:
    tags:
      - 'v*'

# Prevent accidental duplicate 60-minute builds from running at the same time
concurrency:
  group: openwrt-vmg8825-build
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OPENWRT_COMMIT: 3d5a743f1f0cb77aed8ed63b2f9aa75700b4322c

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout overlay repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache zstd

      - name: Checkout upstream OpenWrt at pinned commit
        run: |
          TARGET_REF="${{ inputs.openwrt_ref || env.OPENWRT_COMMIT }}"
          echo "Checking out upstream OpenWrt ref: ${TARGET_REF}"
          mkdir -p openwrt-src
          git -C openwrt-src init
          git -C openwrt-src remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt-src fetch --depth=1 origin "${TARGET_REF}"
          git -C openwrt-src checkout FETCH_HEAD

      - name: Apply upstream patches and overlay
        run: |
          for p in patches/upstream/*.patch; do
            git -C openwrt-src apply "$PWD/$p"
          done
          cp -a openwrt-overlay/. openwrt-src/

      - name: Restore OpenWrt download, host tools & ccache caches (cuts rebuild time ~3x)
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            openwrt-src/dl
            openwrt-src/staging_dir/host
            openwrt-src/staging_dir/hostpkg
            ~/.ccache
          key: openwrt-vmg8825-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('openwrt-overlay/target/linux/bcm63xx_arm/vmg8825-b50b.diffconfig', 'openwrt-overlay/target/linux/bcm63xx_arm/config-6.18') }}
          restore-keys: |
            openwrt-vmg8825-${{ env.OPENWRT_COMMIT }}-

      - name: Inject persistent apk signing key (optional APK_SIGN_KEY secret)
        env:
          APK_SIGN_KEY: ${{ secrets.APK_SIGN_KEY }}
        run: |
          if [ -n "$APK_SIGN_KEY" ]; then
            echo "Using persistent APK_SIGN_KEY secret for apk feed signing."
            printf '%s\n' "$APK_SIGN_KEY" > openwrt-src/private-key.pem
            chmod 600 openwrt-src/private-key.pem
            openssl ec -in openwrt-src/private-key.pem -pubout -out openwrt-src/public-key.pem
          else
            echo "No APK_SIGN_KEY secret configured; OpenWrt will generate an ephemeral key for this build."
          fi

      - name: Update feeds and configure build
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp target/linux/bcm63xx_arm/vmg8825-b50b.diffconfig .config
          echo "CONFIG_CCACHE=y" >> .config
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ inputs.build_all_kmods }}" = "true" ]; then
            echo "Enabling CONFIG_ALL_KMODS=y for complete GitHub Pages kmod-* feed"
            echo "CONFIG_ALL_KMODS=y" >> .config
          else
            echo "Fast image build mode (CONFIG_ALL_KMODS disabled)"
          fi
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j"$(nproc)" IGNORE_ERRORS=m

      - name: Build OpenWrt images and kernel modules
        working-directory: openwrt-src
        run: |
          # IGNORE_ERRORS=m matches official OpenWrt buildbots: required (=y) image
          # packages and kernel remain strictly fatal, while broken optional (=m)
          # third-party feed kmods (e.g. libpfring on Linux 6.18) are skipped cleanly.
          make -j"$(nproc)" IGNORE_ERRORS=m || make -j1 V=s IGNORE_ERRORS=m

      - name: Save build cache (even on partial runs)
        if: always() && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            openwrt-src/dl
            openwrt-src/staging_dir/host
            openwrt-src/staging_dir/hostpkg
            ~/.ccache
          key: ${{ steps.build-cache.outputs.cache-primary-key }}

      - name: Prepare release artifacts (100% GPLv2, zero proprietary blobs)
        if: inputs.skip_release != true
        run: |
          mkdir -p release-artifacts pages-site/targets/bcm63xx_arm/generic/packages
          OUT="openwrt-src/bin/targets/bcm63xx_arm/generic"
          cp "$OUT"/openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-squashfs.bin release-artifacts/
          cp "$OUT"/openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-initramfs.bin release-artifacts/
          cp "$OUT"/openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b.manifest release-artifacts/ || true
          cp scripts/vmg8825_factory_builder.py release-artifacts/
          cp scripts/vmg8825_ssh_backup_and_install.sh release-artifacts/
          cp scripts/vmg8825_mrd_info.py release-artifacts/
          (cd release-artifacts && sha256sum openwrt-* vmg8825_* > sha256sums)

          # Stage kmod-* apk feed for GitHub Pages
          cp -a "$OUT/packages/." pages-site/targets/bcm63xx_arm/generic/packages/
          if [ -f openwrt-src/public-key.pem ]; then
            cp openwrt-src/public-key.pem pages-site/public-key.pem
          fi
          cat > pages-site/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>OpenWrt Zyxel VMG8825-B50B kmod Feed</title></head>
          <body>
          <h1>OpenWrt Zyxel VMG8825-B50B (bcm63xx_arm) Kernel Module Feed</h1>
          <p>Target apk repository: <code>targets/bcm63xx_arm/generic/packages/packages.adb</code></p>
          <p>Public signing key: <a href="public-key.pem">public-key.pem</a></p>
          <p>Setup guide: <a href="https://github.com/4d000/openwrt-zyxel-vmg8825-b50b/blob/main/docs/PACKAGES_AND_UPDATES.md">PACKAGES_AND_UPDATES.md</a></p>
          </body></html>
          HTML

      - name: Determine release tag
        if: inputs.skip_release != true
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v$(date -u +%Y.%m.%d)-r1"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        if: inputs.skip_release != true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "OpenWrt Zyxel VMG8825-B50B (${{ steps.tag.outputs.value }})"
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## OpenWrt (Linux 6.18) for Zyxel VMG8825-B50B (BCM63138)

            **100% Legal Distribution:** This release contains **zero proprietary Zyxel/Broadcom blobs** (`cferam` is not included; Wi-Fi uses official `linux-firmware`).

            - **First-time install from stock Zyxel Web GUI:** Download `openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-squashfs.bin` and `vmg8825_factory_builder.py`, then follow [docs/INSTALLATION.md](docs/INSTALLATION.md).
            - **Upgrading an existing OpenWrt VMG8825-B50B:** Upload `openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-squashfs.bin` directly in LuCI (*System → Backup / Flash Firmware*) or run `vmg8825-upgrade` via SSH — your device's own `cferam.XXX` is preserved automatically.
            - **Installing `kmod-*` packages:** Follow [docs/PACKAGES_AND_UPDATES.md](docs/PACKAGES_AND_UPDATES.md) to add the GitHub Pages `apk` feed.

      - name: Upload GitHub Pages artifact (kmod-* apk feed)
        if: inputs.skip_release != true
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy-pages:
    needs: build
    if: inputs.skip_release != true
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy kmod feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
