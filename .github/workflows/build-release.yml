name: Build OpenWrt Release & kmod Feed

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag (e.g. v2026.11-r1). Leave empty for date-based tag.'
        required: false
        default: ''
      build_all_kmods:
        description: 'Build all kmod-* packages for GitHub Pages apk feed'
        type: boolean
        default: true
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  pages: write
  id-token: write

env:
  OPENWRT_COMMIT: 3d5a743f1f0cb77aed8ed63b2f9aa75700b4322c

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout overlay repository
        uses: actions/checkout@v4

      - name: Free disk space on runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h

      - name: Install OpenWrt build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
            gettext git libncurses-dev libssl-dev python3-setuptools rsync swig \
            unzip zlib1g-dev file wget ccache zstd

      - name: Checkout upstream OpenWrt at pinned commit
        run: |
          mkdir -p openwrt-src
          git -C openwrt-src init
          git -C openwrt-src remote add origin https://github.com/openwrt/openwrt.git
          git -C openwrt-src fetch --depth=1 origin "${OPENWRT_COMMIT}"
          git -C openwrt-src checkout "${OPENWRT_COMMIT}"

      - name: Apply upstream patches and overlay
        run: |
          for p in patches/upstream/*.patch; do
            git -C openwrt-src apply "$PWD/$p"
          done
          cp -a openwrt-overlay/. openwrt-src/

      - name: Restore OpenWrt download & ccache cache
        uses: actions/cache@v4
        with:
          path: |
            openwrt-src/dl
            ~/.ccache
          key: openwrt-vmg8825-${{ env.OPENWRT_COMMIT }}-${{ hashFiles('openwrt-overlay/target/linux/bcm63xx_arm/vmg8825-b50b.diffconfig') }}
          restore-keys: |
            openwrt-vmg8825-${{ env.OPENWRT_COMMIT }}-

      - name: Update feeds and configure build
        working-directory: openwrt-src
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          cp target/linux/bcm63xx_arm/vmg8825-b50b.diffconfig .config
          echo "CONFIG_CCACHE=y" >> .config
          if [ "${{ inputs.build_all_kmods || 'true' }}" = "true" ]; then
            echo "CONFIG_ALL_KMODS=y" >> .config
          fi
          make defconfig

      - name: Download sources
        working-directory: openwrt-src
        run: make download -j"$(nproc)"

      - name: Build OpenWrt images and kernel modules
        working-directory: openwrt-src
        run: make -j"$(nproc)" || make -j1 V=s

      - name: Prepare release artifacts (100% GPLv2, zero proprietary blobs)
        run: |
          mkdir -p release-artifacts pages-site/targets/bcm63xx_arm/generic/packages
          OUT="openwrt-src/bin/targets/bcm63xx_arm/generic"
          cp "$OUT"/openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-squashfs.bin release-artifacts/
          cp "$OUT"/openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-initramfs.bin release-artifacts/
          cp "$OUT"/openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b.manifest release-artifacts/ || true
          cp scripts/vmg8825_factory_builder.py release-artifacts/
          cp scripts/vmg8825_ssh_backup_and_install.sh release-artifacts/
          (cd release-artifacts && sha256sum openwrt-* vmg8825_* > sha256sums)

          # Stage kmod-* apk feed for GitHub Pages
          cp -a "$OUT/packages/." pages-site/targets/bcm63xx_arm/generic/packages/
          if [ -f openwrt-src/public-key.pem ]; then
            cp openwrt-src/public-key.pem pages-site/public-key.pem
          fi
          cat > pages-site/index.html <<'HTML'
          <!doctype html>
          <html><head><meta charset="utf-8"><title>OpenWrt Zyxel VMG8825-B50B kmod Feed</title></head>
          <body>
          <h1>OpenWrt Zyxel VMG8825-B50B (bcm63xx_arm) Kernel Module Feed</h1>
          <p>Target apk repository: <code>targets/bcm63xx_arm/generic/packages/packages.adb</code></p>
          <p>Public signing key: <a href="public-key.pem">public-key.pem</a></p>
          </body></html>
          HTML

      - name: Determine release tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          elif [ -n "${{ inputs.release_tag }}" ]; then
            TAG="${{ inputs.release_tag }}"
          else
            TAG="v$(date -u +%Y.%m.%d)-r1"
          fi
          echo "value=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.value }}
          name: "OpenWrt Zyxel VMG8825-B50B (${{ steps.tag.outputs.value }})"
          generate_release_notes: true
          files: |
            release-artifacts/*
          body: |
            ## OpenWrt (Linux 6.18) for Zyxel VMG8825-B50B (BCM63138)

            **100% Legal Distribution:** This release contains **zero proprietary Zyxel/Broadcom blobs** (`cferam` is not included; Wi-Fi uses official `linux-firmware`).

            - **First-time install from stock Zyxel Web GUI:** Download `openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-squashfs.bin` and `vmg8825_factory_builder.py`, then follow [docs/INSTALLATION.md](docs/INSTALLATION.md) to assemble your `.ras.bin` using your own official Zyxel firmware.
            - **Upgrading an existing OpenWrt VMG8825-B50B:** Upload `openwrt-bcm63xx_arm-generic-zyxel_vmg8825-b50b-squashfs.bin` directly in LuCI (*System → Backup / Flash Firmware*) or run `vmg8825-upgrade` via SSH — your device's own `cferam.XXX` is preserved automatically.

      - name: Upload GitHub Pages artifact (kmod-* apk feed)
        uses: actions/upload-pages-artifact@v3
        with:
          path: pages-site

  deploy-pages:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy kmod feed to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
